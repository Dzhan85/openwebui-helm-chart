apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-webui.fullname" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 8080
      name: http
  selector:
    {{- include "open-webui.selectorLabels" . | nindent 4 }}
